name: CI/CD Pipeline - Credit Scoring API

on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - release/*
    tags:
      - v*
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# Permissions: the build job pushes the Docker image to ghcr.io with the
# built-in GITHUB_TOKEN, which needs packages: write.
permissions:
  contents: read
  packages: write

# Environment variables available to all jobs and steps
env:
  DOCKER_IMAGE_NAME: "credit-scoring-api"
  DOCKER_REGISTRY: "ghcr.io"

jobs:
  test:
    # Run unit and integration tests on the API and model.
    # This job must pass before any deployment.
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'uv'
          
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
          
      - name: Sync dependencies with uv
        run: |
          uv sync --frozen
          
      - name: Install test dependencies
        run: |
          uv pip install pytest pytest-cov httpx
          
      - name: Train model for testing
        run: |
          # data/raw is gitignored: train only when the dataset is available
          if [ -f data/raw/application_train.csv ]; then
            uv run python -m api.train_model --nrows 20000
          else
            echo "::warning::data/raw not available, skipping training (tests use mocks and a synthetic preprocessor)"
          fi
          
      - name: Run unit tests
        run: |
          uv run pytest tests/ -v --cov=api.main --cov-report=xml:coverage.xml
          
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
          
      - name: Check test coverage
        run: |
          # Minimum coverage requirement on the serving code: 80%
          # (training pipeline code requires the dataset and is not unit-testable in CI)
          uv run pytest tests/ --cov=api.main --cov-fail-under=80
          
      - name: Run integration tests
        run: |
          if [ ! -f api/models/credit_scoring_model.pkl ]; then
            echo "::warning::No model artifact (dataset absent), skipping integration test"
            exit 0
          fi
          # Test that the API starts and serves predictions correctly
          uv run python -c "
          import os
          os.environ['MODEL_PATH'] = 'api/models/credit_scoring_model.pkl'
          from api.main import app
          from fastapi.testclient import TestClient
          
          client = TestClient(app)
          
          # Test health endpoint
          response = client.get('/health')
          assert response.status_code == 200
          print('Health check: PASSED')
          
          # Test schema endpoint (raw input fields)
          response = client.get('/schema')
          assert response.status_code == 200
          assert response.json()['n_fields'] > 100
          print('Schema check: PASSED')
          
          # Test prediction endpoint with raw Home Credit fields
          response = client.post('/predict', json={
              'AMT_INCOME_TOTAL': 202500.0,
              'AMT_CREDIT': 500000.0,
              'AMT_ANNUITY': 30000.0,
              'DAYS_BIRTH': -12000,
              'DAYS_EMPLOYED': -1500,
              'EXT_SOURCE_1': 0.5,
              'EXT_SOURCE_2': 0.6,
              'EXT_SOURCE_3': 0.7,
              'CODE_GENDER': 'M',
              'NAME_INCOME_TYPE': 'Working',
          })
          assert response.status_code == 200
          assert 'probability' in response.json()
          print('Prediction test: PASSED')
          "

  build:
    # Build Docker image.
    # Only runs if tests pass.
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Output image information
        run: |
          echo "Docker image built successfully!"
          echo "Image: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  deploy-staging:
    # Deploy to staging environment (Render).
    # Only runs on push to develop branch or main branch.
    name: Deploy to Staging
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to Render (Staging)
        run: |
          echo "Deploying to Render staging environment..."
          
          # Get the latest image tag
          IMAGE_TAG="${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "Image to deploy: $IMAGE_TAG"
          
          # Use Render API to trigger deployment
          # Note: This is a placeholder - actual implementation depends on Render's API
          if [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "Deploying via Render API..."
            # curl -X POST https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys \
            #   -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            #   -H "Content-Type: application/json" \
            #   -d '{"image": "'$IMAGE_TAG'"}'
            echo "Deployment triggered!"
          else
            echo "::warning::RENDER_API_KEY not configured. Manual deployment required."
            echo "To deploy manually:"
            echo "1. Push the Docker image to a registry"
            echo "2. Update the Render service with the new image tag"
            echo "3. Or use: render blueprint deploy"
          fi
          
      - name: Verify deployment
        run: |
          echo "Waiting for deployment to complete..."
          # Add verification logic here
          # For example, poll the health endpoint until it returns 200
          # This would require the deployment URL to be available

  deploy-production:
    # Deploy to production environment (Render).
    # Only runs on push to main branch or when a tag is pushed.
    name: Deploy to Production
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Wait for staging deployment to complete
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Waiting for staging verification..."
          sleep 60  # Wait 1 minute for staging to be verified
          
      - name: Deploy to Render (Production)
        run: |
          echo "Deploying to Render production environment..."
          
          # Get the latest image tag
          IMAGE_TAG="${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "Image to deploy: $IMAGE_TAG"
          
          # Use Render API to trigger deployment
          if [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "Deploying via Render API..."
            # curl -X POST https://api.render.com/v1/services/${{ secrets.RENDER_PROD_SERVICE_ID }}/deploys \
            #   -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            #   -H "Content-Type: application/json" \
            #   -d '{"image": "'$IMAGE_TAG'"}'
            echo "Production deployment triggered!"
          else
            echo "::warning::RENDER_API_KEY not configured. Manual deployment required."
          fi
          
      - name: Verify production deployment
        run: |
          echo "Verifying production deployment..."
          # Add production verification logic
          # For example, test the production endpoint

  # Manual deployment job (can be triggered from GitHub UI)
  deploy-manual:
    # Manual deployment job.
    # Can be triggered from GitHub Actions UI.
    name: Manual Deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:manual-${{ github.sha }}
          
      - name: Notify user
        run: |
          echo "Manual deployment completed!"
          echo "Image: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:manual-${{ github.sha }}"
