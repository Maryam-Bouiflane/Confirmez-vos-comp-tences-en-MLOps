name: CI/CD Pipeline - Credit Scoring API

on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - release/*
    tags:
      - v*
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# Permissions: the build job pushes the Docker image to ghcr.io with the
# built-in GITHUB_TOKEN, which needs packages: write.
permissions:
  contents: read
  packages: write

# Environment variables available to all jobs and steps
env:
  DOCKER_IMAGE_NAME: "credit-scoring-api"
  DOCKER_REGISTRY: "ghcr.io"

jobs:
  test:
    # Run unit and integration tests on the API and model.
    # This job must pass before any deployment.
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          
      - name: Sync dependencies with uv
        run: |
          uv sync --frozen
          
      - name: Install test dependencies
        run: |
          uv pip install pytest pytest-cov httpx
          
      - name: Train model for testing
        run: |
          # data/raw is gitignored: train only when the dataset is available
          if [ -f data/raw/application_train.csv ]; then
            uv run python -m api.train_model --nrows 20000
          else
            echo "::warning::data/raw not available, skipping training (tests use mocks and a synthetic preprocessor)"
          fi
          
      - name: Run unit tests
        run: |
          uv run pytest tests/ -v --cov=api.main --cov-report=xml:coverage.xml
          
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
          
      - name: Check test coverage
        run: |
          # Minimum coverage requirement on the serving code: 80%
          # (training pipeline code requires the dataset and is not unit-testable in CI)
          uv run pytest tests/ --cov=api.main --cov-fail-under=80
          
      - name: Run integration tests
        run: |
          if [ ! -f api/models/credit_scoring_model.pkl ]; then
            echo "::warning::No model artifact, skipping integration test"
            exit 0
          fi
          # Test that the API starts and serves predictions correctly.
          # The 'with' context is required: it runs the startup event,
          # which loads the model (a bare TestClient serves degraded).
          uv run python -c "
          import os
          os.environ['MODEL_PATH'] = 'api/models/credit_scoring_model.pkl'
          from api.main import app
          from fastapi.testclient import TestClient

          with TestClient(app) as client:
              # Health: model loaded from the committed artifact
              response = client.get('/health')
              assert response.status_code == 200, response.text
              assert response.json()['status'] == 'healthy'
              print('Health check: PASSED')

              # Schema: raw input fields served dynamically
              response = client.get('/schema')
              assert response.status_code == 200, response.text
              assert response.json()['n_fields'] == len(response.json()['fields'])
              assert response.json()['n_fields'] == 22  # form-fields model
              print('Schema check: PASSED')

              # Prediction from raw Home Credit fields
              response = client.post('/predict', json={
                  'AMT_INCOME_TOTAL': 202500.0,
                  'AMT_CREDIT': 500000.0,
                  'AMT_ANNUITY': 30000.0,
                  'DAYS_BIRTH': -12000,
                  'DAYS_EMPLOYED': -1500,
                  'EXT_SOURCE_1': 0.5,
                  'EXT_SOURCE_2': 0.6,
                  'EXT_SOURCE_3': 0.7,
                  'CODE_GENDER': 'M',
                  'NAME_INCOME_TYPE': 'Working',
              })
              assert response.status_code == 200, response.text
              assert 'probability' in response.json()
              print('Prediction test: PASSED')
          "

  build:
    # Build Docker image.
    # Only runs if tests pass.
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Output image information
        run: |
          echo "Docker image built successfully!"
          echo "Image: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

# NOTE: deployment is handled by Render, not by this workflow.
# Each Render service deploys its branch automatically after the checks
# above pass (autoDeployTrigger: checksPass in render.yaml /
# render.staging.yaml). The former placeholder deploy-* jobs were removed:
# jobs skipped by their 'if:' conditions never report a success status,
# which blocked Render's 'after CI checks pass' trigger.
