[project]
name = "projet-6"
version = "0.1.0"
description = "Credit Scoring API with FastAPI, Docker, and CI/CD pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.9",
    "mlflow>=3.13.0",
    "numpy>=2.4.6",
    "optuna>=4.9.0",
    "optuna-dashboard>=0.20.0",
    "optuna-integration[lightgbm]>=4.9.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    # API dependencies
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    # Streamlit dependencies
    "streamlit>=1.29.0",
    "plotly>=5.18.0",
    "requests>=2.31.0",
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "mypy>=1.8.0",
    "pandas-stubs>=2.0.0",
]

# Application project (not a library): uv installs the dependencies only,
# it does not build/install the project package itself.
[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "joblib"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "optuna_integration.*"]
ignore_missing_imports = true
