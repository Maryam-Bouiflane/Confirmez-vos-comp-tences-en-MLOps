services:
  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-scoring-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MODEL_PATH=/app/api/models/credit_scoring_model.pkl
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./api/models:/app/api/models:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      # Single source of truth: the stack Docker and the local uv runs share
      # the SAME ./tracking store (training runs + predictions in one place)
      - ./tracking:/app/tracking
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - credit-scoring-network

  # Streamlit Frontend
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: credit-scoring-streamlit
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - API_URL=http://api:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      # Drift summaries are written on the host (monitoring/drift_analysis.py)
      # and read by the Data Drift tab: share the folder with the container
      - ./monitoring:/app/monitoring
    restart: unless-stopped
    networks:
      - credit-scoring-network

  # MLflow UI: browse training runs and predictions of the shared store
  # (http://localhost:5001 — port distinct d un mlflow ui local sur 5000)
  mlflow-ui:
    # Pinned to match the project's MLflow version: sharing one sqlite store
    # between different MLflow versions migrates the schema (one-way) and
    # breaks the older reader. Keep in sync with pyproject/uv.lock.
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: mlflow ui --backend-store-uri sqlite:////app/tracking/mlflow.db --host 0.0.0.0 --port 5000
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - ./tracking:/app/tracking
    restart: unless-stopped
    networks:
      - credit-scoring-network

networks:
  credit-scoring-network:
    driver: bridge

