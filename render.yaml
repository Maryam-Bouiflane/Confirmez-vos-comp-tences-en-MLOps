# Render Blueprint — PRODUCTION
#
# This blueprint instance is bound to the main branch.
# The staging services are defined in a separate blueprint instance
# (render.staging.yaml, bound to the develop branch), because a Render
# Blueprint instance is attached to a single branch for sync and
# auto-deploy triggers.
#
# Services deploy automatically after the CI checks on main pass
# (autoDeployTrigger: checksPass).
#
# Note on API_URL: it is set to the API's full URL directly. The
# fromService "host" property resolves to the bare service name
# (without the .onrender.com domain), which breaks the dashboard's
# requests — the URL is stable, so a direct value is the reliable fix.

services:
  # FastAPI Backend Service (Production)
  - type: web
    name: credit-scoring-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    autoDeployTrigger: checksPass
    region: frankfurt
    plan: free

    # Environment variables
    envVars:
      - key: MODEL_PATH
        value: /app/api/models/credit_scoring_model.pkl
      # MLflow: sqlite:////tmp/mlflow.db (absolute path, 4 slashes) so the
      # non-root user can write it; /tmp is ephemeral on Render anyway.
      # For persistent tracking, set MLFLOW_TRACKING_URI to a remote
      # server in the Render dashboard (secret), not in this file.
      - key: MLFLOW_TRACKING_URI
        value: sqlite:////tmp/mlflow.db
      - key: MLFLOW_EXPERIMENT
        value: credit_scoring_api

    # Health check
    healthCheckPath: /health

  # Streamlit Frontend Service (Production)
  - type: web
    name: credit-scoring-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile.streamlit
    branch: main
    autoDeployTrigger: checksPass
    region: frankfurt
    plan: free

    # Environment variables
    envVars:
      - key: API_URL
        # Full URL of the production API (see header note about fromService)
        value: https://credit-scoring-api-onnj.onrender.com

    # Health check
    healthCheckPath: /
